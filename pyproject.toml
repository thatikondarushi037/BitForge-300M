[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bitforge"
version = "0.1.0"
description = "BitNet-inspired ternary Transformer research foundations"
requires-python = ">=3.13,<3.14"
dependencies = ["torch>=2.7.1,<2.8"]

[project.optional-dependencies]
dev = ["numpy>=2.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]

